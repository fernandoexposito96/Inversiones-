<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07111f" />
  <title>Inversiones</title>
  <style>
    :root{--bg:#07111f;--panel:#0d1b2d;--line:#20354f;--text:#f3f7fb;--muted:#8da0b7;--green:#3ee68a;--red:#ff616d;--blue:#4c91ff}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body{color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 20% 0,#10253f 0,#07111f 34%,#050c16 100%)}button{font:inherit}.app{width:min(1100px,100%);margin:0 auto;padding:28px 24px 40px}.header{margin-bottom:20px}.header h1{margin:0;font-size:36px;letter-spacing:-.045em}.periods{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.periods button{border:1px solid var(--line);background:#0b1828;color:#c8d6e5;padding:10px 15px;border-radius:12px;font-weight:800;cursor:pointer}.periods button.active{background:#183f6f;border-color:#315f98;color:#fff}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:16px}.metric,.chart-card{border:1px solid var(--line);background:linear-gradient(180deg,#112238,#0a1727);border-radius:22px;box-shadow:0 18px 50px rgba(0,0,0,.22)}.metric{padding:18px}.metric span{display:block;color:var(--muted);font-size:13px;font-weight:800}.metric strong{display:block;margin-top:8px;font-size:28px;letter-spacing:-.04em}.metric.positive strong{color:var(--green)}.metric.negative strong{color:var(--red)}.chart-card{padding:18px}.chart-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:10px}.chart-head h2{margin:0;font-size:19px}.chart-head p{margin:4px 0 0;color:var(--muted);font-size:12px}.chart-head>strong{font-size:20px}#chart{display:block;width:100%;height:320px}@media(max-width:760px){.app{padding:20px 12px 26px}.header h1{font-size:31px}.metrics{grid-template-columns:1fr 1fr;gap:9px}.metric{padding:14px;border-radius:18px}.metric strong{font-size:22px}.chart-card{padding:14px;border-radius:18px}#chart{height:240px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="header"><h1>Inversiones</h1></header>

    <nav class="periods" id="periods" aria-label="Periodo">
      <button data-period="today">Hoy</button>
      <button data-period="week" class="active">Semana</button>
      <button data-period="month">Mes</button>
      <button data-period="all">Todo</button>
    </nav>

    <section class="metrics" aria-label="Resumen">
      <article class="metric"><span>Apostado</span><strong id="staked">0,00 €</strong></article>
      <article class="metric positive"><span>Cobrado</span><strong id="returned">0,00 €</strong></article>
      <article class="metric negative"><span>Pérdida</span><strong id="loss">0,00 €</strong></article>
      <article class="metric positive" id="netCard"><span>Beneficio neto</span><strong id="net">0,00 €</strong></article>
    </section>

    <section class="chart-card">
      <div class="chart-head">
        <div><h2>Gráfico de evolución</h2><p id="periodLabel">Esta semana</p></div>
        <strong id="chartTotal">0,00 €</strong>
      </div>
      <canvas id="chart" width="1200" height="430" aria-label="Evolución del beneficio neto"></canvas>
    </section>
  </main>

  <script>
    const STORAGE_KEY='mi-control.entries.v1';
    let entries=[];
    let period='week';
    const euro=v=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(Number(v||0));
    const $=id=>document.getElementById(id);
    try{entries=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]')}catch{entries=[]}
    const netOf=e=>Number(e.returned||0)-Number(e.stake||0);
    function startOfWeek(date=new Date()){const d=new Date(date);d.setHours(0,0,0,0);const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return d}
    function inPeriod(e){const d=new Date(e.date+'T12:00:00'),now=new Date();if(period==='all')return true;if(period==='today')return e.date===now.toISOString().slice(0,10);if(period==='week'){const s=startOfWeek(now),end=new Date(s);end.setDate(s.getDate()+7);return d>=s&&d<end}return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth()}
    function currentEntries(){return entries.filter(inPeriod).sort((a,b)=>a.date.localeCompare(b.date)||Number(a.createdAt||0)-Number(b.createdAt||0))}
    function render(){const list=currentEntries();const staked=list.reduce((s,e)=>s+Number(e.stake||0),0);const returned=list.reduce((s,e)=>s+Number(e.returned||0),0);const loss=list.reduce((s,e)=>s+Math.max(0,-netOf(e)),0);const net=returned-staked;$('staked').textContent=euro(staked);$('returned').textContent=euro(returned);$('loss').textContent=euro(loss);$('net').textContent=(net>0?'+':'')+euro(net);$('chartTotal').textContent=(net>0?'+':'')+euro(net);$('netCard').classList.toggle('negative',net<0);$('netCard').classList.toggle('positive',net>=0);$('periodLabel').textContent={today:'Hoy',week:'Esta semana',month:'Este mes',all:'Todo el tiempo'}[period];drawChart(list)}
    document.querySelectorAll('#periods button').forEach(button=>button.addEventListener('click',()=>{period=button.dataset.period;document.querySelectorAll('#periods button').forEach(b=>b.classList.toggle('active',b===button));render()}));
    function drawChart(list){const canvas=$('chart'),ctx=canvas.getContext('2d'),rect=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;canvas.width=Math.max(600,Math.round(rect.width*dpr));canvas.height=Math.max(240,Math.round(rect.height*dpr));ctx.setTransform(dpr,0,0,dpr,0,0);const w=rect.width,h=rect.height,p=40;ctx.clearRect(0,0,w,h);ctx.strokeStyle='rgba(150,180,210,.12)';ctx.lineWidth=1;for(let i=0;i<5;i++){const y=p+(h-p*2)*i/4;ctx.beginPath();ctx.moveTo(p,y);ctx.lineTo(w-p,y);ctx.stroke()}let cumulative=0;let points=list.map(e=>(cumulative+=netOf(e)));if(!points.length)points=[0];const min=Math.min(0,...points),max=Math.max(0,...points),span=Math.max(1,max-min),step=(w-p*2)/Math.max(1,points.length-1),coords=points.map((v,i)=>[p+i*step,h-p-((v-min)/span)*(h-p*2)]);ctx.beginPath();coords.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.strokeStyle=cumulative>=0?'#3ee68a':'#ff616d';ctx.lineWidth=3;ctx.stroke();ctx.lineTo(coords[coords.length-1][0],h-p);ctx.lineTo(coords[0][0],h-p);ctx.closePath();const g=ctx.createLinearGradient(0,p,0,h);g.addColorStop(0,cumulative>=0?'rgba(62,230,138,.20)':'rgba(255,97,109,.18)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fill();ctx.fillStyle='#8296ac';ctx.font='11px system-ui';ctx.fillText(euro(max),4,p+4);ctx.fillText(euro(min),4,h-p+4)}
    window.addEventListener('resize',()=>drawChart(currentEntries()));
    if('serviceWorker'in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()))}
    if('caches'in window){caches.keys().then(keys=>keys.forEach(k=>caches.delete(k)))}
    render();
  </script>
</body>
</html>
