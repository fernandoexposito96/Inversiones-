<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07111f" />
  <title>Inversiones</title>
  <link rel="stylesheet" href="./styles.css?v=clean-1" />
</head>
<body>
  <main class="app">
    <header class="header">
      <p>CONTROL PERSONAL</p>
      <h1>Inversiones</h1>
    </header>

    <nav class="periods" id="periods" aria-label="Periodo">
      <button data-period="today">Hoy</button>
      <button data-period="week" class="active">Semana</button>
      <button data-period="month">Mes</button>
      <button data-period="all">Todo</button>
    </nav>

    <section class="metrics" aria-label="Resumen">
      <article class="metric">
        <span>Apostado</span>
        <strong id="staked">0,00 €</strong>
      </article>
      <article class="metric positive">
        <span>Cobrado</span>
        <strong id="returned">0,00 €</strong>
      </article>
      <article class="metric negative">
        <span>Pérdida</span>
        <strong id="loss">0,00 €</strong>
      </article>
      <article class="metric positive" id="netCard">
        <span>Beneficio neto</span>
        <strong id="net">0,00 €</strong>
      </article>
    </section>

    <section class="chart-card">
      <div class="chart-head">
        <div>
          <h2>Gráfico de evolución</h2>
          <p id="periodLabel">Esta semana</p>
        </div>
        <strong id="chartTotal">0,00 €</strong>
      </div>
      <canvas id="chart" width="1200" height="430" aria-label="Evolución del beneficio neto"></canvas>
    </section>
  </main>

  <script src="./app.js?v=clean-1"></script>
</body>
</html>
