name: Harden Inversiones once

on:
  push:
    branches: [main]
    paths:
      - scripts/harden_index.py

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace inline logic safely
        run: python3 scripts/harden_index.py
      - name: Commit hardened index
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already hardened"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Blindar lógica sin cambiar diseño"
          git push
