name: Deploy Mi Control

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build lean static site
        run: |
          mkdir -p _site
          cp index.html core.js app.js all-overview.js _site/
          sed -i "s/core.js?v=[^\"]*/core.js?v=${GITHUB_SHA}/" _site/index.html
          sed -i "s/app.js?v=[^\"]*/app.js?v=${GITHUB_SHA}/" _site/index.html
          sed -i "s#</body>#<script src=\"all-overview.js?v=${GITHUB_SHA}\"></script></body>#" _site/index.html
          test -s _site/index.html
          test -s _site/core.js
          test -s _site/app.js
          test -s _site/all-overview.js
          grep -q "core.js?v=${GITHUB_SHA}" _site/index.html
          grep -q "app.js?v=${GITHUB_SHA}" _site/index.html
          grep -q "all-overview.js?v=${GITHUB_SHA}" _site/index.html
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test published app
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            HTML="$(curl -fsSL --max-time 20 "${PAGE_URL}?check=${GITHUB_SHA}" || true)"
            if grep -Fq "app.js?v=${GITHUB_SHA}" <<<"$HTML" && grep -Fq "all-overview.js?v=${GITHUB_SHA}" <<<"$HTML" && grep -Fq 'Meta 3.000' <<<"$HTML"; then
              APP_JS="$(curl -fsSL --max-time 20 "${PAGE_URL}app.js?v=${GITHUB_SHA}" || true)"
              CORE_JS="$(curl -fsSL --max-time 20 "${PAGE_URL}core.js?v=${GITHUB_SHA}" || true)"
              OVERVIEW_JS="$(curl -fsSL --max-time 20 "${PAGE_URL}all-overview.js?v=${GITHUB_SHA}" || true)"
              if grep -Fq 'normalizeEntriesStrict' <<<"$APP_JS" && grep -Fq 'validateGoal' <<<"$CORE_JS" && grep -Fq 'allOverview' <<<"$OVERVIEW_JS"; then
                echo "Published app smoke test OK"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Published app did not expose the expected commit after retries" >&2
          exit 1
