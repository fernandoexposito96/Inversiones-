name: Validate Inversiones
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check required files
        run: test -f index.html && test -f core.js && test -f app.js && test -f tests.cjs && test -f ui-tests.cjs
      - name: Check JavaScript syntax
        run: |
          node --check core.js
          node --check app.js
          node --check tests.cjs
          node --check ui-tests.cjs
      - name: Run calculation tests
        run: node tests.cjs
      - name: Run UI contract tests
        run: node ui-tests.cjs
      - name: Check clean app wiring
        run: |
          grep -Eq '<script src="core.js(\?[^\"]*)?"></script>' index.html
          grep -Eq '<script src="app.js(\?[^\"]*)?"></script>' index.html
          grep -q 'id="tabInvest"' index.html
          grep -q 'id="tabGoal"' index.html
          grep -q 'id="investView"' index.html
          grep -q 'id="goalView"' index.html
          grep -q 'id="goalDaily"' index.html
          grep -q 'id="daysLeft"' index.html
          ! grep -q 'id="historyList"' index.html
          ! grep -q 'Historial de movimientos' index.html
          ! test -f evolution-live.js
